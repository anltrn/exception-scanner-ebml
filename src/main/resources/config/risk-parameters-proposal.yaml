# Risk modeli — konfig + sade dil. Varsayılan: enterprise-java (CLI profil vermezsen de bu yüklenir).
# Okuma rehberi: docs/risk-hesaplama-tr.md

version: proposal-2026-03
profile_default: enterprise-java

# ---------------------------------------------------------------------------
# Skor nasıl birleşir? (metod)
# ---------------------------------------------------------------------------
explainable_model:
  summary_tr: >
    Her metod için dört boyut ölçülür. Her boyut 0–1 alt skor üretir.
    En yüksek alt skor metodun ana riskidir; diğerleri skora %15 oranında karışır.
  steps_tr:
    - id: measure
      text: "CC, kod satırı, iç içe derinlik ve parametre sayısını say."
    - id: subscores
      text: "Her boyutu dikkat / yüksek / kritik eşiklerine göre 0–1 alt skora çevir."
    - id: dominant
      text: "Dört alt skordan en büyüğünü seç; risk seviyesi önce buna göre etiketlenir."
    - id: blend
      text: "Ağırlıklı ortalama alt skor hesapla; final = dominant + (karışım_oranı × blend), seviye tavanına sıkıştır."
  level_bands_tr:
    DÜŞÜK: "Skor 0 – 29,999 — tipik getter, delegasyon, basit validasyon"
    ORTA: "30 – 49,999 — refactor planlanabilir; code review'da not düş"
    YÜKSEK: "50 – 79,999 — test ve sadeleştirme öncelikli"
    KRİTİK: "80 – 100 — parçala / acil müdahale adayı"
  score_scale: 100
  score_mix:
    dominant_weight: 0.65
    blend_weight: 0.35
    note_tr: >
      final = 58% * max(risk boyutları alt skorları) + 42% * ağırlıklı ortalama + ince ayırıcı (0–100, 3 ondalık).
      FOUT skora dahil değildir (katalog metriği).
      Aynı ham metrik vektörü olmadıkça iki metodun skoru çakışmaz.
  blend:
    ratio: 0.42
    note_tr: "Geriye dönük: score_mix yoksa dominant=1-ratio, blend=ratio."

# ---------------------------------------------------------------------------
# Boyut şablonu (profiller bunu override eder)
# ---------------------------------------------------------------------------
dimension_template:
  branching:
    id: branching
    field: cyclomaticComplexity
    label_tr: "Dallanma karmaşıklığı (CC)"
    measures_tr: "if, else, for, while, catch, &&, ||, switch kolu vb. karar noktaları"
    service_examples_tr:
      - "Tek if'li facade metodu → düşük"
      - "Kural motoru / çok dallı ETL → yüksek"
    threshold_labels: [dikkat, yuksek, kritik]
    subscore_meaning_tr:
      below_dikkat: "Alt skor ~0–0.29; ek risk sayılmaz"
      dikkat_to_yuksek: "Alt skor ~0.30–0.49; Sonar/PMD 'complexity' uyarısına denk gelir"
      yuksek_to_kritik: "Alt skor ~0.50–0.79; refactor backlog"
      above_kritik: "Alt skor 0.80+; metod bölünmeli"
  length:
    id: length
    field: codeLines
    label_tr: "Metod kod satırı (LOC)"
    measures_tr: "Yorum ve boş satır hariç gerçek kod satırları"
    service_examples_tr:
      - "15–20 satırlık servis metodu → mock'ta tipik"
      - "100+ satır tek metod → god-method adayı"
    threshold_labels: [dikkat, yuksek, kritik]
  nesting:
    id: nesting
    field: maxNestingDepth
    label_tr: "İç içe blok derinliği"
    measures_tr: "if/for/while/try/switch iç içe kaç kat"
    service_examples_tr:
      - "Düz akış, early return → 0–3"
      - "Legacy ETL iç içe if/for → 5+ sık görülür"
    threshold_labels: [dikkat, yuksek, kritik]
  parameters:
    id: parameters
    field: parameterCount
    label_tr: "Parametre sayısı"
    measures_tr: "Metod imzasındaki parametre adedi"
    service_examples_tr:
      - "DTO + id → 1–2 parametre"
      - "7+ parametre → DTO veya builder öner"
    threshold_labels: [dikkat, yuksek, kritik]

