# =====================================================================
#  Exception Kullanim Tarayici - Ayar dosyasi
#  Windows'ta dosya yollarini / ile yazin (C:/tarama/scannedRepos gibi).
# =====================================================================

# Kaynak:
#   server : Bitbucket Server / Data Center
#   cloud  : bitbucket.org
#   git    : GitHub, GitLab veya herhangi bir git adresi (git.urls)
#   local  : bilgisayardaki bir proje veya proje klasorleri (local.dir), ag gerekmez
# Bu degerlerin hepsi komut satirindan da verilebilir (--help)
source=server

# --- Bitbucket Server / Data Center ---
bitbucket.url=https://bitbucket.sirketiniz.com

# --- Bitbucket Cloud ---
# bitbucket.workspace=sirket-workspace
# bitbucket.url=https://api.bitbucket.org

# Kimlik bilgileri. Token'i dosyaya yazmak yerine BITBUCKET_TOKEN ortam
# degiskeniyle vermeniz onerilir (BITBUCKET_USERNAME da desteklenir).
# Kullanici adi bossa "Bearer <token>", doluysa Basic auth kullanilir.
bitbucket.username=
bitbucket.token=

# Taranacak proje anahtarlari (virgulle). Bossa erisilebilen tum projeler.
bitbucket.projects=
# Haric tutulacak repolar: "repo-slug", "PROJE/repo-slug" veya * ile kalip
# (or. z_atil_* -> z_atil_ ile baslayanlar). Buyuk-kucuk harf duyarsiz.
bitbucket.exclude.repos=z_atil_*,nova-*
bitbucket.include.archived=false

# --- source=git ---
# Virgulle birden fazla adres verilebilir. .../tree/<dal> seklindeki adreslerde dal adresten alinir.
# Ozel repolarda makinedeki git kimlik bilgileri veya SSH anahtari kullanilir.
git.urls=

# --- Git ---
# http veya ssh. ssh secilirse makinedeki SSH anahtari kullanilir.
git.protocol=http
# Bossa her reponun varsayilan dali taranir (or. develop yazabilirsiniz)
git.branch=
# Git icin API'den farkli bir kullanici adi gerekiyorsa
git.username=
git.timeout.minutes=15
# Sadece taramada okunan dosyalari indir (.java, pom.xml/build dosyalari, EBML aciksa .ebml/.dsxml/
# processdefinition.xml). Jar, resim, dokuman gibi buyuk dosyalar indirilmez; buyuk repolarda klonlamayi
# cok hizlandirir. Git sunucusu partial clone desteklemiyorsa normal klona doner (logda uyari cikar).
git.sparse=true

# Kurumsal sertifika sorunu varsa gecici olarak true yapilabilir.
# Kalici cozum: sirket CA sertifikasini JDK truststore'a eklemek.
ssl.insecure=false

# --- Aranacak exception ---
# Tam nitelikli sinif adi, birden fazlaysa virgulle. Sadece metot cagrisi
# aranacaksa (call.N) bos birakilabilir.
exception.classes=com.firma.framework.exception.CustomException
# Yeni yapiya ait, eski siniftan tureyen ve raporlanmamasi gereken siniflar
exception.ignore.classes=
# true: import kontrolu yapmadan sadece sinif adina gore eslestirir
match.lenient=false

# --- Aranacak kullanim desenleri ---
# Constructor'a gecilen argumanlarin sekli. Desenler sirayla denenir,
# ilk eslesen desen raporlanir. Hicbirine uymayan kullanimlar rapora girmez.
# Hic desen tanimlanmazsa sinifin tum kullanimlari raporlanir.
#
# Kullanilabilecek degerler (virgulle, arguman sirasiyla):
#   0, -1, 99       tam olarak bu sayi (0, 0L, 0x0 ayni kabul edilir)
#   INT             herhangi bir sayi
#   STRING          koda yazilmis mesaj: "sabit", "a" + x birlestirme, String.format(...)
#   STRING_LITERAL  sadece sabit string: "deneme"
#   GETMESSAGE      e.getMessage()
#   CAUSE           catch'te yakalanan exception degiskeni (e)
#   CONST           BUYUK_HARF sabit (HataKodlari.KAYIT_YOK)
#   VAR             diger degisken veya ifade
#   ANY             herhangi bir arguman
#   *               (sadece sonda) kalan argumanlar ne olursa olsun
#
# pattern.N.type  : veritabanindaki kullanim tipi kodu (exception_usage.usage_type_code).
#                   Verilmezse desen adindan uretilir: "Id 0 + mesaj" -> ID_0_MESAJ
# pattern.N.legacy: false ise dogru kullanim sayilir (takip icin kaydedilir, eski kullanim degildir)
#
# throw new CustomException(0, "deneme");
pattern.1.name=Id 0 + mesaj
pattern.1.type=KOD0_SERBEST_METIN
pattern.1.args=0,STRING
# throw new CustomException(0, "deneme", e);  veya ek parametreli halleri
pattern.2.name=Id 0 + mesaj + ek parametre
pattern.2.type=KOD0_SERBEST_METIN_EK
pattern.2.args=0,STRING,*
# Istege bagli diger ornekler:
# pattern.3.name=Id 0 + degiskendeki mesaj
# pattern.3.args=0,VAR,*
# pattern.4.name=Id 0 + baska exception'in mesaji
# pattern.4.args=0,GETMESSAGE,*
# pattern.5.name=Sadece mesaj
# pattern.5.args=STRING,*
# Her desen icin rapordaki "Yapilacak" sutunu (opsiyonel):
# pattern.1.action=Yeni yapiya cevrilmeli

# --- Aranacak metot cagrilari ---
# Exception disindaki hata bildirme yollarini da bulmak icin, or. mobile hata kodu yazan
#   outBag.put(GENERALERRORCODE.ERROR_CODE, e.getErrorCode());
#   outBag.put(GENERALERRORCODE.ERROR_CODE, 0);
# call.N.method : metot adi (zorunlu)
# call.N.scope  : cagrildigi nesne, or. outBag (opsiyonel; bossa hangi nesne olduguna bakilmaz)
# call.N.args   : pattern ile ayni degerler, ayrica:
#                   GENERALERRORCODE.ERROR_CODE  bu sabitin kendisi
#                   getErrorCode()               bu metodun cagrisi (e.getErrorCode() gibi)
#                   'errorCode'                  tam olarak bu string
#                   A|B                          alternatifler, or. GENERALERRORCODE.ERROR_CODE|'errorCode'
#                 Sabit adiyla ayni string ("ERROR_CODE") sabit deseniyle otomatik eslesir.
# call.1.name=Mobil hata kodu
# call.1.method=put
# call.1.args=GENERALERRORCODE.ERROR_CODE,ANY

# true: sadece dogrudan "throw new ..." seklindekiler. false: degiskene atanip
# sonra firlatilanlar da dahil (rapordaki Baglam sutunu ayrimi gosterir)
scan.throw.only=false

# --- Tarama ---
work.dir=./scannedRepos
output.dir=./executeReports
# source=local icin taranacak klasor. Tek bir proje (pom.xml, build.xml, .project
# veya src iceren klasor) ya da icinde birden fazla proje/repo bulunan bir klasor olabilir
local.dir=
scan.exclude.dirs=target,build,bin,out,classes,node_modules,generated,generated-sources
# UTF-8 olmayan eski dosyalar icin yedek karakter seti
scan.fallback.charset=windows-1254
# Ayni anda ayristirilan (taranan) repo sayisi. OutOfMemoryError alirsaniz dusurun
# veya Java'ya daha fazla bellek verin: java -Xmx4g -jar ...
threads=4
# Ayni anda klonlanan/guncellenen repo sayisi. Projeler paralel islenir: repolar projeler
# arasinda sirayla (A1, B1, C1, A2, ...) dagitilir, klonlama ve ayristirma ayri havuzlarda calisir.
git.threads=8
# Bu boyuttan buyuk Java dosyalari (genelde uretilmis kod) atlanir ve raporda listelenir
scan.max.file.kb=2048
# Her Bitbucket projesi icin ayri Excel dosyasi uret
report.per.project=true
# Bulunan kullanimlardan en fazla kac tanesi konsola da yazilsin (0 = yazma)
console.limit=200
# Exception'i yakalayan catch bloklarini da ayri sayfada raporla
report.catch.blocks=false

# =====================================================================
#  PostgreSQL envanter eslestirmesi (--db ile de acilabilir)
#  Tablolar: sql/exception_usage_postgres.sql
# =====================================================================
db.enabled=false
# true: eslestir ve raporda goster ama tabloya yazma (--db-dry-run)
db.dry.run=false
db.url=jdbc:postgresql://localhost:5432/envanter
# Kullanici ve sifreyi DB_USER / DB_PASSWORD ortam degiskenleriyle vermeniz onerilir
db.user=
db.password=
db.schema=env

# Mevcut envanter tablolari (sadece okunur)
db.class.table=env.java_class
db.class.id.column=id
db.class.fqcn.column=fqcn
# Ayni FQCN birden fazla uygulamada varsa sinif sorgusuna ek kosul, or. app_name = 'aurora'
db.class.filter=
db.method.table=env.java_method
db.method.id.column=id
db.method.class.column=class_id
db.method.name.column=name
# Varsa parametre bilgisini tutan sutun (overload'lari ayirt etmek icin), or. signature
db.method.signature.column=
# Tabloda constructor'in tutuldugu adlar; {class} sinifin basit adidir
db.method.constructor.names=<init>,{class}
db.fqcn.case.insensitive=false

# Yazilacak tablolar
db.usage.table=env.exception_usage
db.usage.type.table=env.exception_usage_type
db.run.table=env.exception_scan_run
# false: sinifi envanterde bulunamayan kullanimlar tabloya yazilmaz (raporda yine gorunur)
db.insert.unmatched=true
# Tarama kaydina aciklama (--db-note)
db.note=

# =====================================================================
#  Ekran / popup / region / Jasper rapor / process envanteri (--ebml ile de acilabilir)
#  Tablolar: sql/ebml_inventory_postgres.sql
#  Veritabanina yazmak icin db.enabled=true (veya --db) da gerekir.
# =====================================================================
ebml.enabled=false
# Region: adi bu onekle baslayan VEYA ebml.region.package altindaki .ebml dosyalari
ebml.region.prefix=RG_
ebml.region.package=ebml.region
# Ekran: bu paket (ve alt paketleri) altindaki .ebml dosyalari
ebml.page.package=ebml.page
# Popup: bu paket (ve alt paketleri) altindaki .ebml dosyalari
ebml.popup.package=ebml.popup
# Jasper rapor: bu paket (ve alt paketleri) altindaki .dsxml dosyalari
ebml.report.package=ebml.report
# Process: bu klasor altindaki <numara>-<ad>.par klasorlerindeki processdefinition.xml dosyalari
#   process/250001-RISM.par/processdefinition.xml -> process_id=250001, process_name=label degeri
ebml.process.dir=process
# Paket adi hesaplanirken atlanacak kaynak klasorleri (ilk eslesen kullanilir)
ebml.source.roots=src/main/java,src/main/resources,src/java,src/resources,JavaSource,source,resources,src
# false: file_name sutununa uzantisiz ad yazilir (MusteriEkrani)
ebml.file.name.with.extension=true
# env.project.project_name sutununda aranacak ana proje adi:
#   REPO              Bitbucket repo adi (bulunamazsa repo slug'i da denenir)
#   REPO_SLUG         Bitbucket repo slug'i (ornek: musteri-servis)
#   MODULE            dosyanin bulundugu modul klasorunun adi (pom.xml / .project olan klasor)
#   BITBUCKET_PROJECT Bitbucket proje adi (bulunamazsa proje anahtari da denenir)
ebml.project.name.from=REPO
ebml.project.case.insensitive=true
# false: projesi env.project tablosunda bulunamayan dosyalar tabloya yazilmaz (raporda yine gorunur)
ebml.insert.unmatched=true

db.project.table=env.project
db.project.id.column=id
db.project.name.column=project_name
db.screen.table=env.all_screens
db.popup.table=env.all_popups
db.region.table=env.all_regions
db.report.table=env.all_reports
db.process.table=env.all_processes

# ---------------------------------------------------------------------
#  Mevcut ekran / popup / rapor / process tablolarinda project_id guncellemesi
#  Taramada bulunan dosyalarin project_id degeri bu tablolara da yazilir
#  (--db ile; --db-dry-run'da yapilmaz). Ad karsilastirmasi buyuk/kucuk harf duyarsizdir.
#  Ayni ad farkli projelerde bulunduysa o kayit guncellenmez. Tablo veya sutun yoksa
#  sadece o tablo atlanir.
# ---------------------------------------------------------------------
ebml.update.existing=true
# true: sadece project_id'si bos olan satirlar guncellenir
ebml.update.only.empty=false
db.existing.project.column=project_id
# Ekran ve region: name = EKRAN001.ebml; page_type=page -> ekran, page_type=region -> region
db.existing.screen.table=env.screen
db.existing.screen.name.column=name
db.existing.screen.type.column=page_type
db.existing.screen.type.page=page
db.existing.screen.type.region=region
# Popup: popup_name = pp_deneme (uzantili ad da denenir)
db.existing.popup.table=env.popup
db.existing.popup.name.column=popup_name
# Rapor: report_name = rapor adi (uzantili ve uzantisiz ad denenir)
db.existing.report.table=env.report
db.existing.report.name.column=report_name
# Process: no = klasordeki numara (250001-RISM.par -> 250001) veya processdefinition.xml'deki name;
#   no ile bulunamazsa name = klasor adinda '-' isaretinden sonraki kisim (RISM)
db.existing.process.table=env.process
db.existing.process.no.column=no
db.existing.process.name.column=name
