# =====================================================================
#  OpenShift'te calisan sunucunun temel ayarlari (ConfigMap: exception-scanner-config)
#  Swagger'dan gelen her tarama istegi bu degerlerin uzerine yazar; istekte
#  verilmeyen alanlar icin buradakiler kullanilir. Tum anahtarlar ve aciklamalari
#  icin depodaki kok scanner.properties dosyasina bakin.
#
#  Gizli degerler buraya yazilmaz, Secret'tan ortam degiskeni olarak gelir:
#  BITBUCKET_USERNAME, BITBUCKET_TOKEN, DB_USER, DB_PASSWORD, SCANNER_API_KEY
#  work.dir / output.dir sunucu tarafindan yonetilir (SCANNER_WORK_DIR, SCANNER_OUTPUT_DIR).
# =====================================================================

source=server
bitbucket.url=https://bitbucket.sirketiniz.com
bitbucket.projects=
bitbucket.exclude.repos=z_atil_*,nova-*
bitbucket.include.archived=false

git.protocol=http
git.branch=
git.timeout.minutes=15
ssl.insecure=false

exception.classes=com.firma.framework.exception.CustomException
pattern.1.name=Id 0 + mesaj
pattern.1.type=KOD0_SERBEST_METIN
pattern.1.args=0,STRING
pattern.2.name=Id 0 + mesaj + ek parametre
pattern.2.type=KOD0_SERBEST_METIN_EK
pattern.2.args=0,STRING,*

# Pod bellegine gore ayarlayin (limit 3Gi icin 4 uygundur)
threads=4
report.per.project=true

db.enabled=false
db.url=jdbc:postgresql://postgresql:5432/envanter
db.schema=env
ebml.enabled=false
