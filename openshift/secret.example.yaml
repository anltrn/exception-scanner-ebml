# ORNEK - gercek degerlerle depoya EKLEMEYIN. Bunun yerine:
#   oc create secret generic exception-scanner-secrets \
#     --from-literal=BITBUCKET_TOKEN=<token> \
#     --from-literal=SCANNER_API_KEY=<rastgele-uzun-deger>
# Kullanici adi bossa token "Bearer" olarak gonderilir; doluysa Basic auth kullanilir.
apiVersion: v1
kind: Secret
metadata:
  name: exception-scanner-secrets
type: Opaque
stringData:
  BITBUCKET_USERNAME: ""
  BITBUCKET_TOKEN: "<bitbucket-http-access-token>"
  SCANNER_API_KEY: "<swagger-ve-api-icin-anahtar>"
  # db.enabled=true ise:
  DB_USER: ""
  DB_PASSWORD: ""
