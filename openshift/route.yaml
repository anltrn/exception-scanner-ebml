# Swagger: https://<route-adresi>/swagger-ui.html
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: code-scanner
  annotations:
    # Buyuk Excel raporlarinin indirilmesi kesilmesin
    haproxy.router.openshift.io/timeout: 5m
spec:
  to:
    kind: Service
    name: code-scanner
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
